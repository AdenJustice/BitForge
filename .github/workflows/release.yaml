name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  release:
    # Publish from the public repository only. The private mirror carries the
    # same tags, and releasing from both would double-publish to CurseForge.
    if: github.repository == 'AdenJustice/BitForge'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Package and Release
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: .release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packaged addon (debug)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-addon
          path: .release/*.zip
          retention-days: 7

      # CurseForge refuses an archive carrying web content, and it decides that
      # after the upload returns -- the packager prints "Success!" either way, so
      # nothing above can see it. That is how v12.1.0.8 and v12.1.0.9 reached
      # GitHub and Wago while CurseForge dropped both without a red build.
      #
      # This runs last, once the zip is on the release where it can be read. It
      # cannot un-send what the packager already uploaded; what it buys is
      # finding out now rather than whenever somebody opens the project page.
      # .pkgmeta's ignore list is what actually keeps these files out of the
      # package -- this only reports that it stopped working.
      - name: Check the package for content CurseForge refuses
        run: |
          for zip in .release/*.zip; do
            found=$(unzip -Z1 "$zip" | grep -iE '\.(html?|css|js)$' || true)
            if [ -n "$found" ]; then
              echo "::error::$zip carries web content CurseForge will reject:"
              printf '%s\n' "$found" | sed 's/^/  /'
              exit 1
            fi
          done

      - name: Delete old successful runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow="release.yaml" \
            --status=success \
            --json databaseId \
            --jq '.[1:].[].databaseId' \
          | xargs -r -I{} gh run delete --repo "${{ github.repository }}" {}
